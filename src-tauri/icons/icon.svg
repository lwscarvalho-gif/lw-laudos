<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C6B58" />
      <stop offset="100%" stop-color="#064034" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Fundo arredondado moderno -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#lwGrad)" filter="url(#shadow)"/>
  
  <!-- Borda de destaque suave -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#25A186" stroke-width="6" opacity="0.6"/>
  
  <!-- Cruz Médica Estilizada / Transdutor de Ultrassom -->
  <g transform="translate(256, 256)">
    <!-- Ondas Ultrassônicas concêntricas -->
    <path d="M -110,-90 A 140,140 0 0,1 110,-90" fill="none" stroke="#E8F3F0" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
    <path d="M -80,-60 A 100,100 0 0,1 80,-60" fill="none" stroke="#E8F3F0" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
    <path d="M -50,-30 A 60,60 0 0,1 50,-30" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Símbolo Médico Central (Cruz Suíça / Saúde) -->
    <rect x="-24" y="-12" width="48" height="136" rx="12" fill="#FFFFFF"/>
    <rect x="-68" y="32" width="136" height="48" rx="12" fill="#FFFFFF"/>
    
    <!-- Núcleo de Destaque -->
    <circle cx="0" cy="56" r="14" fill="#0C6B58"/>
  </g>
  
  <!-- Tipografia LW elegante na base -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#E8F3F0" text-anchor="middle" letter-spacing="4">LW LAUDOS</text>
</svg>
