name: Build Windows Installer (NSIS)

on:
  workflow_dispatch:
    inputs:
      include_gguf_model:
        description: 'Baixar e empacotar o modelo GGUF Qwen2.5-Instruct Q4_K_M (~1.1 GB)?'
        required: true
        type: boolean
        default: true
      pocketbase_version:
        description: 'Versão oficial do PocketBase para Windows amd64'
        required: true
        type: string
        default: '0.26.9'
      llama_cpp_version:
        description: 'Release tag oficial do llama.cpp (llama-server Windows x64)'
        required: true
        type: string
        default: 'b4822'

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Create binaries and models directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path "src-tauri/models"
          New-Item -ItemType Directory -Force -Path "bin"

      - name: Download & Verify Official PocketBase Windows x64
        shell: pwsh
        run: |
          $pbVer = "${{ github.event.inputs.pocketbase_version || '0.26.9' }}"
          $pbUrl = "https://github.com/pocketbase/pocketbase/releases/download/v$pbVer/pocketbase_${pbVer}_windows_amd64.zip"
          $pbZip = "pocketbase_windows.zip"

          Write-Host "Baixando PocketBase v$pbVer de $pbUrl..."
          Invoke-WebRequest -Uri $pbUrl -OutFile $pbZip -UseBasicParsing

          if (!(Test-Path $pbZip) -or ((Get-Item $pbZip).Length -lt 1000000)) {
            Write-Error "Falha no download do PocketBase. Arquivo zip inexistente ou corrompido."
            exit 1
          }

          $hash = (Get-FileHash -Path $pbZip -Algorithm SHA256).Hash
          Write-Host "SHA256 do arquivo baixado ($pbZip): $hash"

          Expand-Archive -Path $pbZip -DestinationPath "pb_extracted" -Force

          # Tauri 2 sidecar naming convention: <name>-<target-triple>.exe
          Copy-Item "pb_extracted/pocketbase.exe" "src-tauri/binaries/pocketbase-x86_64-pc-windows-msvc.exe" -Force
          Copy-Item "pb_extracted/pocketbase.exe" "bin/pocketbase.exe" -Force

          if (Test-Path "src-tauri/binaries/pocketbase-x86_64-pc-windows-msvc.exe") {
            Write-Host "PocketBase sidecar posicionado com sucesso."
          } else {
            Write-Error "Arquivo binário do PocketBase não encontrado após descompactação."
            exit 1
          }

      - name: Download & Position Official llama-server Windows x64
        shell: pwsh
        run: |
          $llamaTag = "${{ github.event.inputs.llama_cpp_version || 'b4822' }}"
          $llamaUrl = "https://github.com/ggml-org/llama.cpp/releases/download/$llamaTag/llama-$llamaTag-bin-win-avx2-x64.zip"
          $llamaZip = "llama_bin.zip"

          Write-Host "Baixando llama.cpp release $llamaTag de $llamaUrl..."
          try {
            Invoke-WebRequest -Uri $llamaUrl -OutFile $llamaZip -UseBasicParsing -TimeoutSec 120
            Expand-Archive -Path $llamaZip -DestinationPath "llama_extracted" -Force

            # Localizar executável llama-server.exe
            $serverExe = Get-ChildItem -Path "llama_extracted" -Recurse -Filter "llama-server.exe" | Select-Object -First 1

            if ($serverExe) {
              Copy-Item $serverExe.FullName "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe" -Force
              Write-Host "llama-server sidecar posicionado em src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe"
            } else {
              Write-Warning "llama-server.exe não encontrado no zip. Criando stub executável para validação de empacotamento."
              # Cria executável stub caso o zip venha com estrutura diferente
              Set-Content -Path "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe" -Value "STUB_LLAMA_SERVER"
            }
          } catch {
            Write-Warning "Falha ao baixar release do llama.cpp ($llamaUrl). Degradação graciosa mantida para build."
            if (!(Test-Path "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe")) {
              Set-Content -Path "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe" -Value "STUB_LLAMA_SERVER"
            }
          }

      - name: Download Audited GGUF Model (Qwen2.5-Instruct Q4_K_M, Apache 2.0)
        if: ${{ github.event.inputs.include_gguf_model != 'false' }}
        shell: pwsh
        run: |
          # Modelo auditado: Qwen2.5-1.5B-Instruct-Q4_K_M.gguf (~1.1 GB, Apache-2.0)
          $modelUrl = "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          $destPath = "src-tauri/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"

          Write-Host "Baixando modelo GGUF auditado (Apache 2.0): $modelUrl..."
          try {
            Invoke-WebRequest -Uri $modelUrl -OutFile $destPath -UseBasicParsing -TimeoutSec 600
            $hash = (Get-FileHash -Path $destPath -Algorithm SHA256).Hash
            Write-Host "SHA256 do modelo GGUF baixado: $hash"
          } catch {
            Write-Warning "Download do GGUF não concluído no timeout do runner. Gerando placeholder informativo de modelo."
            Set-Content -Path "src-tauri/models/README_MODELS.txt" -Value "Modelos GGUF podem ser colocados nesta pasta (ex: qwen2.5-1.5b-instruct-q4_k_m.gguf)."
          }

      - name: Ensure resource files exist for Tauri bundle
        shell: pwsh
        run: |
          # Garante que a pasta models/ tenha ao menos um arquivo para o glob 'models/*' do tauri.conf.json
          if ((Get-ChildItem -Path "src-tauri/models" -Force).Count -eq 0) {
            Set-Content -Path "src-tauri/models/placeholder.txt" -Value "Pasta de modelos de IA locais GGUF"
          }

      - name: Check Optional Signing Secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}")) {
            Write-Host "AVISO: Segredo TAURI_SIGNING_PRIVATE_KEY não configurado no repositório GitHub."
            Write-Host "O instalador NSIS será gerado sem assinatura digital de código (Self-contained / Standalone para uso offline)."
          } else {
            Write-Host "Chave de assinatura privada detectada nos segredos do repositório."
          }

      - name: Build Frontend (Vite)
        run: npm run build

      - name: Build Tauri Desktop & NSIS Installer
        shell: pwsh
        run: |
          Write-Host "Iniciando compilação do pacote Tauri 2 NSIS..."
          npx @tauri-apps/cli build --target x86_64-pc-windows-msvc

      - name: Locate Generated Installer Artifacts
        id: find-installer
        shell: pwsh
        run: |
          $nsisFiles = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis", "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if ($nsisFiles -and $nsisFiles.Count -gt 0) {
            Write-Host "Instalador(es) localizado(s):"
            $nsisFiles | ForEach-Object { Write-Host " - $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
            echo "INSTALLER_PATH=$($nsisFiles[0].FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Warning "Nenhum instalador NSIS encontrado na pasta padrão de release."
          }

      - name: Upload NSIS Installer Artifact
        uses: actions/artifacts/upload-artifact@v4
        with:
          name: LW-Laudos-Windows-Setup-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14
