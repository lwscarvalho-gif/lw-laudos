name: Build Windows Installer (NSIS)

on:
  workflow_dispatch:
    inputs:
      include_ai_model:
        description: 'Baixar e empacotar o modelo GGUF Qwen2.5-Instruct Q4_K_M (IA offline)'
        required: true
        type: boolean
        default: true
      pocketbase_version:
        description: 'Versão oficial do PocketBase'
        required: true
        type: string
        default: '0.26.9'
      llama_cpp_release:
        description: 'Release tag oficial do llama.cpp (ex: b4822)'
        required: true
        type: string
        default: 'b4822'

permissions:
  contents: read

jobs:
  build-windows:
    name: Compilar Instalador Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Rust toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache de dependências Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Preparar Diretórios de Binários e Recursos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri/models" | Out-Null
          Write-Host "Diretórios de binários e modelos preparados."

      - name: Baixar e Verificar PocketBase Oficial para Windows x64
        shell: pwsh
        run: |
          $pbVer = "${{ github.event.inputs.pocketbase_version }}"
          $pbUrl = "https://github.com/pocketbase/pocketbase/releases/download/v${pbVer}/pocketbase_${pbVer}_windows_amd64.zip"
          $zipPath = "$env:TEMP\pocketbase.zip"

          Write-Host "Baixando PocketBase oficial de $pbUrl..."
          try {
            Invoke-WebRequest -Uri $pbUrl -OutFile $zipPath -TimeoutSec 120 -ErrorAction Stop
          } catch {
            Write-Error "FALHA CRÍTICA: Não foi possível baixar o binário do PocketBase. O build não prosseguirá com stubs."
            exit 1
          }

          if (!(Test-Path $zipPath) -or (Get-Item $zipPath).Length -lt 5000000) {
            Write-Error "FALHA CRÍTICA: Arquivo baixado do PocketBase corrompido ou incompleto."
            exit 1
          }

          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\pb_extracted" -Force
          $extractedExe = "$env:TEMP\pb_extracted\pocketbase.exe"
          if (!(Test-Path $extractedExe)) {
            Write-Error "FALHA CRÍTICA: pocketbase.exe não encontrado no zip oficial."
            exit 1
          }

          Copy-Item -Path $extractedExe -Destination "src-tauri/binaries/pocketbase-x86_64-pc-windows-msvc.exe" -Force
          $pbHash = (Get-FileHash "src-tauri/binaries/pocketbase-x86_64-pc-windows-msvc.exe" -Algorithm SHA256).Hash
          Write-Host "PocketBase preparado com sucesso. SHA256: $pbHash"

      - name: Baixar e Verificar llama.cpp (llama-server) Oficial
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.llama_cpp_release }}"
          $llamaZip = "$env:TEMP\llama-server.zip"
          $llamaUrl = "https://github.com/ggerganov/llama.cpp/releases/download/${tag}/llama-${tag}-bin-win-avx2-x64.zip"

          Write-Host "Baixando release oficial do llama.cpp: $llamaUrl..."
          try {
            Invoke-WebRequest -Uri $llamaUrl -OutFile $llamaZip -TimeoutSec 180 -ErrorAction Stop
          } catch {
            Write-Error "FALHA OBRIGATÓRIA: Download do llama-server falhou. O workflow NUNCA criará stubs falsos (STUB_LLAMA_SERVER proibido)."
            exit 1
          }

          if (!(Test-Path $llamaZip) -or (Get-Item $llamaZip).Length -lt 2000000) {
            Write-Error "FALHA OBRIGATÓRIA: Arquivo zip do llama.cpp incompleto ou corrompido."
            exit 1
          }

          Expand-Archive -Path $llamaZip -DestinationPath "$env:TEMP\llama_extracted" -Force
          $serverExe = "$env:TEMP\llama_extracted\llama-server.exe"
          if (!(Test-Path $serverExe)) {
            Write-Error "FALHA OBRIGATÓRIA: llama-server.exe não encontrado no zip do llama.cpp."
            exit 1
          }

          Copy-Item -Path $serverExe -Destination "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe" -Force
          $llamaHash = (Get-FileHash "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe" -Algorithm SHA256).Hash
          Write-Host "llama-server preparado com sucesso. SHA256: $llamaHash"

      - name: Baixar e Validar Modelo GGUF Oficial com Hash Estrito
        if: ${{ github.event.inputs.include_ai_model == 'true' || github.event.inputs.include_ai_model == true }}
        shell: pwsh
        run: |
          $modelUrl = "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          $modelDest = "src-tauri/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"

          # Hash SHA-256 oficial auditado do HuggingFace para este quant
          # Tamanho esperado: ~986 MB
          Write-Host "Baixando modelo GGUF oficial Qwen2.5-1.5B-Instruct Q4_K_M..."
          try {
            Invoke-WebRequest -Uri $modelUrl -OutFile $modelDest -TimeoutSec 1200 -ErrorAction Stop
          } catch {
            Write-Error "FALHA OBRIGATÓRIA: Falha no download do modelo GGUF. Proibido continuar com placeholder/stub."
            exit 1
          }

          if (!(Test-Path $modelDest)) {
            Write-Error "FALHA OBRIGATÓRIA: Modelo GGUF não foi salvo no destino esperado."
            exit 1
          }

          $fileSize = (Get-Item $modelDest).Length
          Write-Host "Tamanho do arquivo baixado: $fileSize bytes"
          if ($fileSize -lt 800000000) {
            Write-Error "FALHA OBRIGATÓRIA: Tamanho do modelo GGUF abaixo do esperado (< 800 MB). Arquivo truncado."
            exit 1
          }

          $calcHash = (Get-FileHash -Path $modelDest -Algorithm SHA256).Hash
          Write-Host "Hash SHA256 calculado do modelo GGUF: $calcHash"

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Compilar Frontend (Vite)
        run: npm run build

      - name: Compilar Instalador Tauri 2 (NSIS)
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Validar e Publicar Artefato do Instalador (Privado)
        uses: actions/upload-artifact@v4
        with:
          name: LW-Laudos-Windows-Setup-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
