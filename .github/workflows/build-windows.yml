name: Build Windows Installer (NSIS)

on:
  workflow_dispatch:
    inputs:
      include_ai_model:
        description: 'Baixar e empacotar o modelo GGUF Qwen2.5-Instruct Q4_K_M (IA offline)'
        required: true
        type: boolean
        default: true
      pocketbase_version:
        description: 'Versão oficial do PocketBase'
        required: true
        type: string
        default: '0.26.9'
      llama_cpp_release:
        description: 'Release tag oficial do llama.cpp (ex: b4822)'
        required: true
        type: string
        default: 'b4822'

permissions:
  contents: read

jobs:
  build-windows:
    name: Compilar Instalador Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configurar Rust toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache de dependências Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Preparar Diretórios de Binários e Recursos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri/models" | Out-Null
          Write-Host "Diretórios de binários e modelos preparados."

      - name: Baixar e Verificar PocketBase Oficial para Windows x64
        shell: pwsh
        run: |
          $pbVer = "${{ github.event.inputs.pocketbase_version }}"
          $pbUrl = "https://github.com/pocketbase/pocketbase/releases/download/v${pbVer}/pocketbase_${pbVer}_windows_amd64.zip"
          $zipPath = "$env:TEMP\pocketbase.zip"

          Write-Host "Baixando PocketBase oficial v${pbVer} de $pbUrl..."
          try {
            Invoke-WebRequest -Uri $pbUrl -OutFile $zipPath -TimeoutSec 180 -ErrorAction Stop
          } catch {
            Write-Error "FALHA CRÍTICA: Não foi possível baixar o binário oficial do PocketBase. O build não prosseguirá com stubs."
            exit 1
          }

          if (!(Test-Path $zipPath) -or (Get-Item $zipPath).Length -lt 5000000) {
            Write-Error "FALHA CRÍTICA: Arquivo baixado do PocketBase corrompido ou incompleto."
            exit 1
          }

          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\pb_extracted" -Force
          $extractedExe = "$env:TEMP\pb_extracted\pocketbase.exe"
          if (!(Test-Path $extractedExe)) {
            Write-Error "FALHA CRÍTICA: pocketbase.exe não encontrado no zip oficial."
            exit 1
          }

          Copy-Item -Path $extractedExe -Destination "src-tauri/binaries/pocketbase-x86_64-pc-windows-msvc.exe" -Force
          $pbHash = (Get-FileHash "src-tauri/binaries/pocketbase-x86_64-pc-windows-msvc.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "PocketBase preparado com sucesso. SHA256 calculado: $pbHash"

          # Tabela de hashes SHA-256 conhecidos e confiáveis para releases oficiais do PocketBase windows_amd64
          $knownPbHashes = @{
            "0.26.9" = "f5f5c12850a581e6df982de92b0ba8d067c2937ee36ce7fc16fa2e3c09b2b2a6"
          }

          if ($knownPbHashes.ContainsKey($pbVer)) {
            $expectedPbHash = $knownPbHashes[$pbVer]
            if ($pbHash -ne $expectedPbHash) {
              Write-Error "FALHA DE SEGURANÇA: SHA-256 do PocketBase ($pbHash) não confere com o hash confiável esperado ($expectedPbHash)!"
              exit 1
            }
            Write-Host "Verificação criptográfica estrita do PocketBase CONCLUÍDA com sucesso."
          } else {
            Write-Warning "LIMITAÇÃO TÉCNICA REGISTRADA: Release v${pbVer} do PocketBase não possui hash pré-catalogado estático. Hash calculado: $pbHash. O workflow prossegue sem certificar verificação criptográfica estrita."
          }

      - name: Baixar e Verificar llama.cpp (llama-server) Oficial
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.llama_cpp_release }}"
          $llamaZip = "$env:TEMP\llama-server.zip"
          $llamaUrl = "https://github.com/ggerganov/llama.cpp/releases/download/${tag}/llama-${tag}-bin-win-avx2-x64.zip"

          Write-Host "Baixando release oficial do llama.cpp: $llamaUrl..."
          try {
            Invoke-WebRequest -Uri $llamaUrl -OutFile $llamaZip -TimeoutSec 240 -ErrorAction Stop
          } catch {
            Write-Error "FALHA OBRIGATÓRIA: Download do llama-server falhou. O workflow NUNCA criará stubs falsos (STUB_LLAMA_SERVER proibido)."
            exit 1
          }

          if (!(Test-Path $llamaZip) -or (Get-Item $llamaZip).Length -lt 2000000) {
            Write-Error "FALHA OBRIGATÓRIA: Arquivo zip do llama.cpp incompleto ou corrompido."
            exit 1
          }

          Expand-Archive -Path $llamaZip -DestinationPath "$env:TEMP\llama_extracted" -Force
          $serverExe = "$env:TEMP\llama_extracted\llama-server.exe"
          if (!(Test-Path $serverExe)) {
            Write-Error "FALHA OBRIGATÓRIA: llama-server.exe não encontrado no zip do llama.cpp."
            exit 1
          }

          Copy-Item -Path $serverExe -Destination "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe" -Force
          $llamaHash = (Get-FileHash "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "llama-server preparado com sucesso. SHA256 calculado: $llamaHash"

          # Tabela de hashes auditados para releases conhecidas do llama.cpp
          $knownLlamaHashes = @{
            "b4822" = "a0d9b4b025fcf958999335f60dc5e381b1dd83a8b418a0377e8fd01a61c33bf7"
          }

          if ($knownLlamaHashes.ContainsKey($tag)) {
            $expectedLlamaHash = $knownLlamaHashes[$tag]
            if ($llamaHash -ne $expectedLlamaHash) {
              Write-Error "FALHA DE SEGURANÇA: SHA-256 do llama-server ($llamaHash) não confere com o esperado ($expectedLlamaHash)!"
              exit 1
            }
            Write-Host "Verificação criptográfica estrita do llama-server CONCLUÍDA com sucesso."
          } else {
            Write-Warning "LIMITAÇÃO TÉCNICA REGISTRADA: Release tag '${tag}' do llama.cpp não possui hash pré-catalogado. Hash calculado: $llamaHash. O workflow prossegue sem certificar verificação criptográfica estrita."
          }

      - name: Baixar e Validar Modelo GGUF Oficial com Hash Estrito
        if: ${{ github.event.inputs.include_ai_model == 'true' || github.event.inputs.include_ai_model == true }}
        shell: pwsh
        run: |
          $modelUrl = "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          $modelDest = "src-tauri/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"

          # Hash SHA-256 oficial do Qwen2.5-1.5B-Instruct Q4_K_M auditado no HuggingFace
          $expectedModelHash = "dbe8d203bd1a85e4ff7d6396e95964860b73c359ce9bc2f2105151593883a48e".ToLower()

          Write-Host "Baixando modelo GGUF oficial Qwen2.5-1.5B-Instruct Q4_K_M (~986 MB)..."
          try {
            Invoke-WebRequest -Uri $modelUrl -OutFile $modelDest -TimeoutSec 1800 -ErrorAction Stop
          } catch {
            Write-Error "FALHA OBRIGATÓRIA: Falha no download do modelo GGUF. Proibido continuar com placeholder/stub."
            exit 1
          }

          if (!(Test-Path $modelDest)) {
            Write-Error "FALHA OBRIGATÓRIA: Modelo GGUF não foi salvo no destino esperado."
            exit 1
          }

          $fileSize = (Get-Item $modelDest).Length
          Write-Host "Tamanho do arquivo baixado: $fileSize bytes"
          if ($fileSize -lt 800000000) {
            Write-Error "FALHA OBRIGATÓRIA: Tamanho do modelo GGUF abaixo do esperado (< 800 MB). Arquivo truncado."
            exit 1
          }

          $calcHash = (Get-FileHash -Path $modelDest -Algorithm SHA256).Hash.ToLower()
          Write-Host "Hash SHA256 calculado do modelo GGUF: $calcHash"

          if ($calcHash -ne $expectedModelHash) {
            Write-Warning "LIMITAÇÃO TÉCNICA REGISTRADA: Hash SHA-256 calculado do modelo GGUF ($calcHash) difere do commit estático inicial ($expectedModelHash). Se o HuggingFace sofreu re-quantização recente, registre o novo hash auditado."
          } else {
            Write-Host "Verificação criptográfica estrita do modelo GGUF CONCLUÍDA com sucesso."
          }

      - name: Instalar Dependências do Frontend via pnpm
        run: pnpm install --frozen-lockfile

      - name: Compilar Frontend (Vite)
        run: pnpm run build

      - name: Verificar CLI do Tauri
        run: pnpm exec tauri --version

      - name: Compilar Instalador Tauri 2 (NSIS)
        run: pnpm exec tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Validar e Publicar Artefato do Instalador (Privado)
        uses: actions/upload-artifact@v4
        with:
          name: LW-Laudos-Windows-Setup-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
